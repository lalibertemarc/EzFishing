<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f5f8f"/>
      <stop offset="0.55" stop-color="#0d2a4a"/>
      <stop offset="1" stop-color="#050d1c"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6f9c"/>
      <stop offset="1" stop-color="#06182e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#e0302a"/>
      <stop offset="1" stop-color="#6e0d0d"/>
    </radialGradient>
    <radialGradient id="white" cx="35%" cy="10%" r="95%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dfe8ee"/>
      <stop offset="1" stop-color="#7d8c99"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f5f17"/>
      <stop offset="0.5" stop-color="#ffe7a0"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>

    <path id="body" d="M200,124 C246,124 266,178 266,214 C266,256 238,292 200,292 C162,292 134,256 134,214 C134,178 154,124 200,124 Z"/>
    <clipPath id="bodyClip"><use xlink:href="#body"/></clipPath>
    <clipPath id="above"><rect x="0" y="0" width="400" height="262"/></clipPath>
    <clipPath id="below"><rect x="0" y="262" width="400" height="138"/></clipPath>

    <!-- Classic bobber: red cap, white belly, wooden stem -->
    <g id="bobber">
      <rect x="195" y="84" width="10" height="44" rx="4" fill="url(#gold)" stroke="#1a0606" stroke-width="4"/>
      <circle cx="200" cy="82" r="9" fill="#ffd34d" stroke="#1a0606" stroke-width="4"/>
      <use xlink:href="#body" fill="url(#white)"/>
      <g clip-path="url(#bodyClip)">
        <path d="M120,208 Q200,226 280,208 L280,100 L120,100 Z" fill="url(#red)"/>
        <path d="M120,208 Q200,226 280,208" fill="none" stroke="#1a0606" stroke-width="4"/>
      </g>
      <use xlink:href="#body" fill="none" stroke="#1a0606" stroke-width="5"/>
      <ellipse cx="172" cy="170" rx="13" ry="24" fill="#ffffff" fill-opacity="0.5" transform="rotate(25 172 170)"/>
    </g>
  </defs>

  <!-- Night sky and glow -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="190" r="175" fill="url(#glow)"/>

  <!-- Water -->
  <rect x="0" y="262" width="400" height="138" fill="url(#water)"/>

  <!-- Fishing line -->
  <path d="M200,74 C214,40 260,10 330,-12" fill="none" stroke="#e8f6ff" stroke-opacity="0.8" stroke-width="3"/>

  <!-- Bobber: crisp above the waterline, faded below it -->
  <use xlink:href="#bobber" clip-path="url(#above)"/>
  <use xlink:href="#bobber" clip-path="url(#below)" opacity="0.3"/>

  <!-- Waterline and ripples -->
  <g fill="none" stroke="#9fe4ff" stroke-linecap="round">
    <ellipse cx="200" cy="263" rx="78" ry="11" stroke="#d8f6ff" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="200" cy="270" rx="122" ry="22" stroke-width="4" stroke-opacity="0.55"/>
    <ellipse cx="200" cy="279" rx="168" ry="35" stroke-width="3" stroke-opacity="0.28"/>
  </g>

  <!-- Splash droplets -->
  <g fill="#bfefff">
    <path d="M112,232 q-8,-14 0,-26 q8,12 0,26z"/>
    <path d="M90,252 q-6,-10 0,-19 q6,9 0,19z"/>
    <path d="M288,232 q8,-14 0,-26 q-8,12 0,26z"/>
    <path d="M310,252 q6,-10 0,-19 q-6,9 0,19z"/>
    <circle cx="124" cy="200" r="5"/>
    <circle cx="278" cy="198" r="5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff6d0">
    <path d="M330,96 l5,15 15,5 -15,5 -5,15 -5,-15 -15,-5 15,-5z"/>
    <path d="M70,96 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4z"/>
    <path d="M92,330 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3z"/>
  </g>
</svg>
